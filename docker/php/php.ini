; CSV imports allow up to SUPPORT_IMPORT_MAX_KB (20 MB); attachments 5 x 5 MB per reply.
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 512M
max_execution_time = 60
expose_php = Off
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; Code is baked into the image, so timestamps never change while the container runs.
opcache.validate_timestamps = 0
