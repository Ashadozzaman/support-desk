[www]
; /ping is answered by php-fpm itself — used by the container healthcheck (cgi-fcgi), never routed by nginx.
ping.path = /ping
ping.response = pong

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Pass the container's environment (DB_HOST, APP_KEY, ...) through to PHP workers.
clear_env = no
